<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Aventura do 3º Trimestre — 4º Ano</title>
<meta name="description" content="Jogo educativo gamificado de revisão do 3º trimestre do 4º ano: Língua Portuguesa, Matemática, História, Geografia, Ciências e Inglês."/>
<meta name="theme-color" content="#1B2A4A"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦉</text></svg>"/>
<style>
/* ===================== Simulado Gamificado 3º Trimestre - Estilos ===================== */
:root{
  --bg1:#1B2A4A; --bg2:#0F1B33;
  --card:#ffffff; --card-shadow: 0 10px 0 rgba(0,0,0,.12), 0 14px 24px rgba(0,0,0,.18);
  --text:#1F2937; --text-soft:#5B6472;
  --yellow:#FFD93D; --green:#6BCB77; --red:#FF5C5C; --blue:#5AC8FA;
  --radius:22px; --radius-sm:14px;
  --font: 'Baloo 2', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family: var(--font);
  background: radial-gradient(circle at 20% 0%, #24406e 0%, var(--bg1) 45%, var(--bg2) 100%);
  color: var(--text);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{ min-height:100vh; padding-bottom:40px; }
#app.fade{ animation:none; }
button{ font-family:inherit; cursor:pointer; border:none; }
input, textarea{ font-family:inherit; }
.screen{ max-width:720px; margin:0 auto; padding:16px 16px 32px; animation:screenIn .35s ease; }
@keyframes screenIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

h1,h2,h3{ margin:0; }
.accent{ color: var(--yellow); }
.title-xl{ font-size:1.8rem; color:#fff; text-align:center; line-height:1.25; margin-bottom:6px; }
.subtitle{ color:#D7DEF0; text-align:center; margin:0 0 18px; font-size:1rem; }
.section-label{ color:#AEB9D4; font-weight:700; font-size:.85rem; text-transform:uppercase; letter-spacing:.04em; margin:18px 0 8px; text-align:center; }

/* -------- Botões -------- */
.btn-primary, .btn-secondary, .btn-danger{
  display:block; width:100%; border-radius:999px; padding:16px 20px; font-size:1.08rem;
  font-weight:800; text-align:center; transition:transform .08s ease, filter .15s ease; margin-top:10px;
}
.btn-primary{ background:linear-gradient(180deg,#58D68D,#2ECC71); color:#fff; box-shadow:0 6px 0 #1E8449, 0 10px 18px rgba(0,0,0,.25); }
.btn-primary:active{ transform:translateY(4px); box-shadow:0 2px 0 #1E8449, 0 4px 10px rgba(0,0,0,.2); }
.btn-primary:disabled{ background:#9CA3AF; box-shadow:0 6px 0 #6B7280; cursor:not-allowed; opacity:.7; }
.btn-big{ font-size:1.2rem; padding:18px 20px; }
.btn-secondary{ background:#fff; color:var(--text); border:2px solid #E2E8F0; box-shadow:0 4px 0 #CBD5E1; }
.btn-secondary:active{ transform:translateY(3px); box-shadow:0 1px 0 #CBD5E1; }
.btn-danger{ background:#fff; color:var(--red); border:2px solid #FFD5D5; box-shadow:0 4px 0 #FFBABA; }
.btn-map{ background:#EAF4FF; color:#0B6FB8; border:2px solid #BFE1FF; box-shadow:0 4px 0 #9BCDFF; }
.back-btn{ background:transparent; color:#fff; font-weight:700; padding:10px 6px; border-radius:12px; }
.back-btn:active{ background:rgba(255,255,255,.12); }

/* -------- Toast -------- */
#toast{ position:fixed; left:50%; bottom:24px; transform:translate(-50%,120%); background:#1F2937; color:#fff;
  padding:12px 20px; border-radius:999px; font-weight:700; z-index:999; transition:transform .35s ease; box-shadow:0 8px 24px rgba(0,0,0,.3); max-width:90vw; text-align:center; }
#toast.show{ transform:translate(-50%,0); }

/* ============== ONBOARDING ============== */
.onboarding-screen{ display:flex; align-items:center; min-height:100vh; }
.onboarding-card{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:var(--radius); padding:22px; width:100%; backdrop-filter: blur(6px); }
.mascot-big{ font-size:4.2rem; text-align:center; filter:drop-shadow(0 6px 10px rgba(0,0,0,.35)); animation:bob 2.4s ease-in-out infinite; }
@keyframes bob{ 0%,100%{transform:translateY(0) rotate(-2deg);} 50%{transform:translateY(-8px) rotate(2deg);} }
.avatar-preview{ width:96px; height:96px; border-radius:50%; margin:10px auto 4px; display:flex; align-items:center; justify-content:center; font-size:3rem; box-shadow:0 8px 0 rgba(0,0,0,.18), 0 12px 20px rgba(0,0,0,.25); border:4px solid #fff; }
.avatar-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.avatar-pick{ background:rgba(255,255,255,.08); border:3px solid transparent; border-radius:16px; padding:10px 0; transition:transform .1s; }
.avatar-pick .avatar-emoji{ font-size:1.8rem; }
.avatar-pick.selected{ border-color:var(--yellow); background:rgba(255,217,61,.18); transform:scale(1.06); }
.avatar-pick:active{ transform:scale(.95); }
.color-grid{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.color-pick{ width:34px; height:34px; border-radius:50%; border:3px solid rgba(255,255,255,.4); }
.color-pick.selected{ border-color:#fff; box-shadow:0 0 0 3px var(--yellow); transform:scale(1.15); }
.name-input{ width:100%; padding:14px 16px; border-radius:14px; border:none; font-size:1.1rem; text-align:center; font-weight:700; margin-bottom:4px; }
.label-optional{ text-transform:none; letter-spacing:normal; font-weight:500; font-size:.78rem; color:#8A96B8; }
.turma-grid{ display:flex; gap:10px; margin-bottom:6px; }
.turma-pick{ flex:1; padding:13px 10px; border-radius:14px; border:3px solid transparent; background:rgba(255,255,255,.1); color:#fff; font-weight:800; font-size:.98rem; }
.turma-pick.selected{ border-color:var(--yellow); background:rgba(255,217,61,.22); }
.turma-pick:active{ transform:scale(.97); }

/* ============== TOPBAR ============== */
.topbar{ display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:10px 12px; margin-bottom:12px; backdrop-filter:blur(6px); position:sticky; top:8px; z-index:10; }
.tb-avatar{ width:44px; height:44px; min-width:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.4rem; border:2px solid #fff; }
.tb-info{ flex:1; min-width:0; }
.tb-name{ color:#fff; font-weight:800; font-size:.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.tb-level{ color:var(--yellow); font-size:.8rem; }
.xp-bar{ background:rgba(255,255,255,.2); border-radius:999px; height:7px; margin-top:4px; overflow:hidden; }
.xp-fill{ background:linear-gradient(90deg,#FFD93D,#FFB84D); height:100%; border-radius:999px; transition:width .4s ease; }
.tb-stat{ color:#fff; font-weight:800; font-size:.9rem; white-space:nowrap; }
.tb-settings{ background:rgba(255,255,255,.12); border-radius:50%; width:38px; height:38px; font-size:1.1rem; color:#fff; }

/* ============== MASCOTE ============== */
.mascot-banner{ display:flex; align-items:center; gap:10px; background:#fff; border-radius:18px; padding:10px 14px; margin:10px 0 16px; box-shadow:var(--card-shadow); }
.mascot-banner.small{ margin:10px 0; padding:8px 12px; }
.mascot-emoji{ font-size:2rem; flex:none; animation:bob 2.4s ease-in-out infinite; }
.mascot-banner .speech{ font-weight:700; color:var(--text); font-size:.95rem; }

/* ============== MAPA / ILHAS ============== */
.island-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
.island-card{ position:relative; background:var(--c, #fff); border-radius:var(--radius); padding:16px 10px 14px; text-align:center; color:#fff; box-shadow:0 8px 0 var(--cd,#999), 0 14px 22px rgba(0,0,0,.25); transition:transform .1s; }
.island-card:active{ transform:translateY(5px); box-shadow:0 3px 0 var(--cd,#999), 0 6px 12px rgba(0,0,0,.2); }
.island-badge{ position:absolute; top:-8px; right:-8px; font-size:1.6rem; filter:drop-shadow(0 3px 4px rgba(0,0,0,.3)); }
.island-icon{ font-size:2.6rem; margin-bottom:4px; }
.island-name{ font-weight:800; font-size:1.02rem; line-height:1.15; }
.island-subtitle{ font-size:.78rem; opacity:.9; margin-bottom:6px; }
.island-stars{ font-weight:800; font-size:.9rem; }
.island-progress-bar{ background:rgba(0,0,0,.2); height:6px; border-radius:999px; margin-top:6px; overflow:hidden; }
.island-progress-fill{ background:#fff; height:100%; border-radius:999px; transition:width .4s ease; }
.trophy-banner{ margin-top:16px; background:linear-gradient(135deg,#FFD93D,#FFB84D); color:#5A3E00; font-weight:800; text-align:center; padding:14px; border-radius:16px; box-shadow:0 6px 0 #C98A00; }

.ranking-cta{ display:block; width:100%; background:linear-gradient(135deg,#FFD93D,#FFB84D); color:#5A3E00; font-weight:800; font-size:1rem; text-align:center; padding:13px; border:none; border-radius:16px; box-shadow:0 5px 0 #C98A00; margin-bottom:14px; cursor:pointer; }
.ranking-cta:active{ transform:translateY(4px); box-shadow:0 1px 0 #C98A00; }

/* ============== RANKING ============== */
.ranking-tabs{ display:flex; gap:8px; margin-bottom:12px; }
.ranking-tab{ flex:1; background:rgba(255,255,255,.1); color:#fff; font-weight:800; font-size:.85rem; padding:10px 6px; border-radius:12px; border:2px solid transparent; }
.ranking-tab.selected{ background:#fff; color:var(--text); border-color:var(--yellow); }
.ranking-list{ margin-top:14px; display:flex; flex-direction:column; gap:8px; }
.ranking-loading, .ranking-empty{ background:#fff; border-radius:16px; padding:22px 16px; text-align:center; color:var(--text-soft); font-weight:700; box-shadow:var(--card-shadow); }
.ranking-row{ display:flex; align-items:center; gap:10px; background:#fff; border-radius:16px; padding:10px 12px; box-shadow:var(--card-shadow); }
.ranking-row.mine{ background:#FFF6DD; border:2px solid #FFD93D; }
.rank-pos{ flex:none; width:36px; text-align:center; font-weight:800; font-size:1rem; color:var(--text-soft); }
.rank-avatar{ flex:none; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.3rem; box-shadow:0 2px 0 rgba(0,0,0,.15); }
.rank-info{ flex:1; min-width:0; }
.rank-name{ font-weight:800; font-size:.92rem; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.you-tag{ background:#FFD93D; color:#5A3E00; font-size:.65rem; padding:1px 6px; border-radius:999px; margin-left:4px; font-weight:800; }
.rank-meta{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:2px; }
.rank-stats{ font-size:.76rem; color:var(--text-soft); font-weight:700; }
.turma-badge{ background:#E9F7FF; color:#0B6FB8; font-size:.68rem; font-weight:800; padding:2px 8px; border-radius:999px; white-space:nowrap; }
.turma-badge.turma-unknown{ background:#F3F4F6; color:var(--text-soft); font-weight:700; }

.badges-section{ margin-top:18px; }
.badge-row{ display:flex; gap:8px; flex-wrap:wrap; }
.badge-chip{ display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:#fff; padding:8px 12px; border-radius:999px; font-size:.78rem; font-weight:700; }
.badge-chip.locked{ opacity:.45; }
.badge-icon{ font-size:1rem; }

/* ============== ILHA (TRILHA) ============== */
.island-screen{ --c:#999; }
.island-header{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.island-header-title{ color:#fff; font-weight:800; font-size:1.1rem; }
.trail{ display:flex; flex-direction:column; align-items:center; gap:28px; margin-top:20px; padding:10px 0 20px; position:relative; }
.trail-node-wrap{ display:flex; flex-direction:column; align-items:center; gap:4px; }
.trail-node-wrap.left{ align-self:flex-start; margin-left:8%; }
.trail-node-wrap.right{ align-self:flex-end; margin-right:8%; }
.trail-node{ width:74px; height:74px; border-radius:50%; background:var(--c); box-shadow:0 8px 0 var(--cd), 0 12px 18px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center; }
.trail-node.locked{ background:#6B7280; box-shadow:0 8px 0 #4B5563, 0 12px 18px rgba(0,0,0,.25); opacity:.75; }
.trail-node.unlocked:active{ transform:translateY(5px); box-shadow:0 3px 0 var(--cd); }
.trail-node-num{ font-size:1.6rem; color:#fff; font-weight:900; }
.trail-node.maxed{ outline:3px solid var(--yellow); outline-offset:3px; }
.trail-node-label{ color:#fff; font-weight:700; font-size:.82rem; text-align:center; max-width:150px; }
.trail-node-stars{ font-size:.95rem; }
.star{ color:rgba(255,255,255,.35); }
.star.filled{ color:var(--yellow); text-shadow:0 0 6px rgba(255,217,61,.6); }

/* ============== INTRO DE FASE ============== */
.phase-intro-screen{ display:flex; align-items:center; min-height:100vh; }
.phase-intro-card{ background:#fff; border-radius:var(--radius); padding:26px 20px; text-align:center; width:100%; box-shadow:var(--card-shadow); }
.phase-intro-icon{ font-size:3rem; }
.phase-intro-cap{ color:var(--text-soft); font-weight:700; font-size:.85rem; text-transform:uppercase; letter-spacing:.05em; }
.phase-intro-title{ font-size:1.4rem; margin:4px 0 10px; }
.phase-intro-stars{ font-size:1.6rem; margin-bottom:6px; }
.phase-intro-sub{ color:var(--text-soft); font-size:.92rem; }

/* ============== QUIZ ============== */
.quiz-top{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.quiz-progress-bar{ flex:1; background:rgba(255,255,255,.2); height:12px; border-radius:999px; overflow:hidden; }
.quiz-progress-fill{ background:linear-gradient(90deg,#6BCB77,#4ECDC4); height:100%; border-radius:999px; transition:width .35s ease; }
.quiz-counter{ color:#fff; font-weight:800; font-size:.9rem; min-width:42px; text-align:right; }
#quitQuiz{ background:rgba(255,255,255,.12); border-radius:50%; width:36px; height:36px; color:#fff; font-size:1rem; }

.q-card{ background:#fff; border-radius:var(--radius); padding:20px 18px 24px; box-shadow:var(--card-shadow); }
.q-part{ color:var(--text-soft); font-weight:700; font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
.q-prompt{ font-size:1.18rem; font-weight:800; line-height:1.35; margin-bottom:14px; }
.q-hint{ color:var(--text-soft); font-size:.85rem; margin:-6px 0 12px; font-style:italic; }
.q-multi-badge{ display:inline-flex; align-items:center; gap:6px; background:linear-gradient(180deg,#FFE27A,var(--yellow)); color:#7A4B00; font-weight:800; font-size:.78rem; letter-spacing:.03em; text-transform:uppercase; padding:6px 12px; border-radius:999px; margin:-4px 0 14px; box-shadow:0 3px 0 #D9A400; }
.q-options{ display:flex; flex-direction:column; gap:10px; }
.option-btn{ background:#F3F4F6; border:2.5px solid transparent; border-radius:16px; padding:14px 16px; font-size:1.02rem; font-weight:700; text-align:left; color:var(--text); transition:transform .08s; }
.option-btn:active{ transform:scale(.98); }
.option-btn.selected{ border-color:var(--blue); background:#E9F7FF; }
.option-btn.correct{ background:#DFF6E3; border-color:var(--green); color:#1B5E25; }
.option-btn.incorrect{ background:#FFE3E3; border-color:var(--red); color:#8A1F1F; }
.q-card.answered .option-btn{ pointer-events:none; }

.q-items{ display:flex; flex-direction:column; gap:14px; }
.q-item-row{ background:#F8FAFC; border-radius:16px; padding:12px; }
.q-item-label{ font-weight:800; margin-bottom:8px; }
.q-item-opts{ display:flex; gap:8px; flex-wrap:wrap; }
.mini-opt{ background:#fff; border:2px solid #E2E8F0; border-radius:12px; padding:9px 14px; font-weight:700; font-size:.92rem; }
.mini-opt.selected{ border-color:var(--blue); background:#E9F7FF; }
.mini-opt.correct{ border-color:var(--green); background:#DFF6E3; color:#1B5E25; }
.mini-opt.incorrect{ border-color:var(--red); background:#FFE3E3; color:#8A1F1F; }
.q-card.answered .mini-opt{ pointer-events:none; }

.q-textarea{ width:100%; border:2px solid #E2E8F0; border-radius:14px; padding:12px; font-size:1rem; resize:vertical; }

.feedback-banner{ margin-top:16px; border-radius:14px; padding:12px 14px; font-weight:800; text-align:center; animation:screenIn .3s ease; }
.feedback-banner.good{ background:#DFF6E3; color:#1B5E25; }
.feedback-banner.bad{ background:#FFE9E0; color:#8A3B1F; }
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:0.95em;line-height:1.15;margin:0 3px;font-weight:700;}
.frac .num{border-bottom:2px solid currentColor;padding:0 4px 1px;}
.frac .den{padding:1px 4px 0;}

.explain-box{ margin-top:12px; background:#EEF2FF; border:2px solid #C7D2FE; border-radius:14px; padding:12px 14px; color:#3730A3; font-size:.95rem; line-height:1.45; display:flex; gap:10px; align-items:flex-start; animation:screenIn .3s ease; }
.explain-box .explain-icon{ font-size:1.2rem; flex:none; line-height:1.2; }
.explain-box .explain-text b{ display:block; font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:#4338CA; margin-bottom:2px; }
.next-btn{ margin-top:14px; }
.q-card.flash-correct{ animation:flashGood .5s ease; }
.q-card.flash-incorrect{ animation:flashBad .5s ease; }
@keyframes flashGood{ 0%{box-shadow:0 0 0 0 rgba(107,203,119,.6);} 100%{box-shadow:0 0 0 18px rgba(107,203,119,0);} }
@keyframes flashBad{ 0%{box-shadow:0 0 0 0 rgba(255,92,92,.5);} 100%{box-shadow:0 0 0 18px rgba(255,92,92,0);} 10%,30%,50%{transform:translateX(-4px);} 20%,40%{transform:translateX(4px);} }

/* ============== RESULTADO ============== */
.result-screen{ display:flex; align-items:center; min-height:100vh; position:relative; }
.result-card{ background:#fff; border-radius:var(--radius); padding:28px 20px; text-align:center; width:100%; box-shadow:var(--card-shadow); position:relative; z-index:2; }
.result-stars{ font-size:2.6rem; margin-bottom:6px; }
.big-star{ color:#E5E7EB; transition:color .2s, transform .2s; display:inline-block; }
.big-star.filled{ color:var(--yellow); text-shadow:0 0 14px rgba(255,217,61,.7); }
.big-star.pop{ animation:pop .45s ease; }
@keyframes pop{ 0%{transform:scale(0);} 60%{transform:scale(1.4);} 100%{transform:scale(1);} }
.result-title{ font-size:1.3rem; margin-bottom:4px; }
.result-score{ color:var(--text-soft); font-weight:700; margin-bottom:10px; }
.result-rewards{ display:flex; gap:10px; justify-content:center; margin:14px 0 4px; flex-wrap:wrap; }
.reward-chip{ background:#FFF7D6; color:#8A6D00; font-weight:800; padding:8px 14px; border-radius:999px; }
#confettiCanvas{ position:fixed; inset:0; pointer-events:none; z-index:1; }

/* ============== MODAL (CONFIGURAÇÕES) ============== */
.modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px; }
.modal{ background:#fff; border-radius:20px; padding:22px; width:100%; max-width:340px; }
.modal h2{ margin:0 0 14px; text-align:center; }
.settings-row{ display:flex; justify-content:space-between; align-items:center; font-weight:700; margin-bottom:14px; }
.settings-row input[type=checkbox]{ width:22px; height:22px; }

/* ============== RESPONSIVO ============== */
@media (min-width:640px){
  .island-grid{ grid-template-columns:repeat(3,1fr); }
  .avatar-grid{ grid-template-columns:repeat(8,1fr); }
}
@media (max-width:380px){
  .title-xl{ font-size:1.5rem; }
  .island-icon{ font-size:2.2rem; }
}

</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script>
/* Banco de questões - 3º Trimestre - 4º Ano
   Fonte: PDFs de conteúdo de provas (Cap. 13-15 Port, Cap.13 Mat, Cap.8-9 Hist,
   Cap.8-9 Geo, Cap.13 Ciências) + lista de vocabulário/gramática de Inglês (Unit 5-6). */

// Fração empilhada (numerador em cima, traço, denominador embaixo) para questões de
// Matemática — muito mais clara para crianças de 10 anos do que "2/3" em texto corrido.
function F(n, d){ return '<span class="frac"><span class="num">'+n+'</span><span class="den">'+d+'</span></span>'; }

const SUBJECTS = [
  // ============================= LÍNGUA PORTUGUESA =============================
  {
    id: 'port', name: 'Ilha das Palavras', subtitle: 'Língua Portuguesa',
    icon: '📖', color: '#FF6B6B', colorDark: '#E85555',
    phases: [
      {
        id: 'port-1', name: 'Poema visual e linguagem figurada', cap: 'Capítulo 13',
        questions: [
          { id:'port-1-1', part:'Poema visual e linguagem figurada', type:'choice',
            prompt:'O que é um poema visual?',

<script>
/* Motor do jogo - Simulado Gamificado 3º Trimestre
   UX/UI pensado para crianças de 10 anos, mobile-first, estilo "mapa de fases". */

// ---------- Avatares ----------
const AVATARS = [
  { id:'hero',   emoji:'🦸' }, { id:'heroine',emoji:'🦸‍♀️' },
  { id:'astro',  emoji:'🧑‍🚀' }, { id:'wizard', emoji:'🧙' },
  { id:'ninja',  emoji:'🥷' }, { id:'fairy',  emoji:'🧚' },
  { id:'robot',  emoji:'🤖' }, { id:'explorer',emoji:'🧭' },
];
const AVATAR_COLORS = ['#FF6B6B','#4ECDC4','#FFB84D','#6BCB77','#A78BFA','#FF8FAB','#5AC8FA','#FFD93D'];

const MASCOT = '🦉';
const MASCOT_LINES = {
  welcome: ["Oi, eu sou o Sábio! Vamos estudar juntos?","Prontinho pra nossa aventura de hoje?","Bora encarar o 3º trimestre com tudo!"],
  islandIntro: ["Essa ilha tem desafios incríveis te esperando!","Vamos nessa? Cada fase te deixa mais forte!"],
  phaseIntro: ["Vamos ver o que você sabe sobre isso!","Respire fundo e vai com calma, você consegue!"],
  correct: ["Isso aí! Mandou bem!","Show de bola!","Perfeito, continue assim!","Você é demais!","Acertou em cheio!"],
  wrong: ["Quase! Vamos para a próxima.","Não foi dessa vez, mas tudo bem!","Respira e tenta a próxima!","Errar faz parte de aprender!"],
  threeStars: ["UAU! Você mandou muito bem, 3 estrelas!","Perfeito! Você é um craque nessa matéria!"],
  twoStars: ["Muito bem! Quase perfeito!","Ótimo trabalho, duas estrelas!"],
  oneStar: ["Você conseguiu! Pode tentar de novo para melhorar.","Boa! Com um pouco mais de prática você chega nas 3 estrelas!"],
  zeroStars: ["Não desanime! Vamos tentar de novo?","Essa fase é difícil mesmo. Bora de novo?"],
  islandComplete: ["Incrível! Você completou essa ilha inteira!","Parabéns, explorador(a)! Ilha concluída!"],
  gameComplete: ["Você é o MESTRE do 3º trimestre! Parabéns!!","Todas as ilhas concluídas! Você é demais!"],
};
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ---------- Áudio (Web Audio API, sem arquivos externos) ----------
const SFX = (() => {
  let ctx = null;
  function getCtx(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx=null; } } return ctx; }
  function tone(freq, start, dur, type='sine', gain=0.18){
    const c = getCtx(); if(!c) return;
    const o = c.createOscillator(); const g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, c.currentTime+start);
    g.gain.setValueAtTime(0, c.currentTime+start);
    g.gain.linearRampToValueAtTime(gain, c.currentTime+start+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+start+dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime+start); o.stop(c.currentTime+start+dur+0.05);
  }
  return {
    enabled: true,
    unlock(){ const c = getCtx(); if(c && c.state==='suspended'){ c.resume(); } },
    correct(){ if(!this.enabled) return; tone(880,0,0.12,'sine'); tone(1174,0.09,0.18,'sine'); },
    wrong(){ if(!this.enabled) return; tone(220,0,0.22,'sawtooth',0.12); tone(160,0.1,0.22,'sawtooth',0.1); },
    click(){ if(!this.enabled) return; tone(520,0,0.06,'square',0.08); },
    whoosh(){ if(!this.enabled) return; tone(300,0,0.15,'sine',0.08); tone(500,0.05,0.15,'sine',0.08); },
    star(){ if(!this.enabled) return; tone(660,0,0.1,'triangle',0.15); tone(880,0.1,0.1,'triangle',0.15); tone(1320,0.2,0.22,'triangle',0.18); },
    victory(){ if(!this.enabled) return; [523,659,784,1047].forEach((f,i)=> tone(f, i*0.13, 0.25, 'triangle', 0.17)); },
    coin(){ if(!this.enabled) return; tone(988,0,0.07,'square',0.1); tone(1319,0.06,0.12,'square',0.1); },
  };
})();

// ---------- Estado / Persistência ----------
const SAVE_KEY = 'quiz3tri_save_v1';
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function defaultSave(){
  return {
    playerName: '', lastName: '', avatar: 'hero', avatarColor: AVATAR_COLORS[0],
    turma: null, // 'A' ou 'B' -- null = ainda não informada (jogador antigo ou pulou)
    xp: 0, coins: 0, streak: 0, lastPlayedDate: null,
    phaseResults: {}, // phaseId -> {stars, bestCorrect, total, attempts}
    badges: [], soundOn: true, createdAt: null,
    playerId: null, // id anônimo estável neste aparelho, usado no ranking compartilhado
  };
}

// ---------- Identidade anônima do jogador (para o ranking compartilhado) ----------
function ensurePlayerId(){
  if (STATE.playerId) return STATE.playerId;
  let id;
  try{ id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : null; }catch(e){ id = null; }
  if (!id) id = 'p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  STATE.playerId = id;
  saveGame();
  return id;
}

// ---------- Total de estrelas (para o ranking) ----------
function totalStarsEarned(){
  let t = 0;
  SUBJECTS.forEach(s => s.phases.forEach(p => { const r = STATE.phaseResults[p.id]; if (r) t += r.stars; }));
  return t;
}
let STATE = loadSave();
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return defaultSave();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultSave(), parsed);
  }catch(e){ return defaultSave(); }
}
function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(STATE)); }catch(e){ /* ignore quota errors */ }
}
function resetGame(){
  // Preserva o playerId através do reset: ele identifica o documento deste
  // aparelho no ranking compartilhado (scores/{playerId}). Se trocasse aqui,
  // o reset criaria um registro novo no Firestore e deixaria o antigo órfão
  // (com dados desatualizados, exibido pra sempre no ranking de todo mundo).
  const keepPlayerId = STATE.playerId;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  STATE = defaultSave();
  STATE.playerId = keepPlayerId;
  saveGame();
}

function registerPlayToday(){
  const t = todayStr();
  if(STATE.lastPlayedDate === t) return; // already counted today
  const y = new Date(); y.setDate(y.getDate()-1);
  const yStr = y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  if(STATE.lastPlayedDate === yStr){ STATE.streak += 1; } else { STATE.streak = 1; }
  STATE.lastPlayedDate = t;
  checkStreakBadges();
  saveGame();
}

// ---------- Level / XP ----------
function levelForXp(xp){ return Math.floor(xp/100) + 1; }
function xpIntoLevel(xp){ return xp % 100; }

// ---------- Badges ----------
const BADGE_DEFS = {
  streak3: { icon:'🔥', name:'Chama de 3 dias', desc:'Jogou 3 dias seguidos' },
  streak7: { icon:'🔥🔥', name:'Chama de 7 dias', desc:'Jogou 7 dias seguidos' },
  firstPhase: { icon:'🥇', name:'Primeiros passos', desc:'Completou a primeira fase' },
  allStars: { icon:'⭐', name:'Perfeccionista', desc:'Conquistou 3 estrelas em uma fase' },
};
function subjectBadgeId(subjId){ return 'island_'+subjId; }
function awardBadge(id){
  if(!STATE.badges.includes(id)){ STATE.badges.push(id); return true; }
  return false;
}
function checkStreakBadges(){
  if(STATE.streak >= 3) awardBadge('streak3');
  if(STATE.streak >= 7) awardBadge('streak7');
}

// ---------- Cálculo de estrelas ----------
function starsFor(correctCount, total){
  const ratio = correctCount/total;
  if (ratio >= 1) return 3;
  if (ratio >= 0.66) return 2;
  if (ratio >= 0.33) return 1;
  return 0;
}

function isPhaseUnlocked(subject, phaseIndex){
  if (phaseIndex === 0) return true;
  const prevPhase = subject.phases[phaseIndex-1];
  const prevResult = STATE.phaseResults[prevPhase.id];
  return !!(prevResult && prevResult.stars >= 1);
}
function isSubjectComplete(subject){
  return subject.phases.every(p => STATE.phaseResults[p.id] && STATE.phaseResults[p.id].stars >= 1);
}
function subjectStars(subject){
  return subject.phases.reduce((a,p)=> a + (STATE.phaseResults[p.id] ? STATE.phaseResults[p.id].stars : 0), 0);
}
function allSubjectsComplete(){ return SUBJECTS.every(isSubjectComplete); }

if (typeof module !== 'undefined') {
  module.exports = {
    AVATARS, AVATAR_COLORS, MASCOT, MASCOT_LINES, pick, SFX,
    SAVE_KEY, defaultSave, loadSave, saveGame, resetGame, registerPlayToday,
    levelForXp, xpIntoLevel, BADGE_DEFS, subjectBadgeId, awardBadge, checkStreakBadges,
    starsFor, isPhaseUnlocked, isSubjectComplete, subjectStars, allSubjectsComplete,
    ensurePlayerId, totalStarsEarned,
  };
}

</script>
<script>
/* Ranking compartilhado via Firebase Firestore (plano Spark, gratuito, sem login).
   Qualquer falha de rede/Firebase é isolada aqui com try/catch: o jogo continua
   funcionando 100% offline mesmo se a nuvem estiver indisponível. */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBT9lGYMVODn4W2mhky7GBgQtLQJs85sAU",
  authDomain: "simulado-4ano-ranking.firebaseapp.com",
  projectId: "simulado-4ano-ranking",
  storageBucket: "simulado-4ano-ranking.firebasestorage.app",
  messagingSenderId: "13551801863",
  appId: "1:13551801863:web:7fa89538422e67ab483ca2",
};

let _db = null;
let _dbFailed = false;
function getDb(){
  if (_db) return _db;
  if (_dbFailed) return null;
  try{
    if (typeof firebase === 'undefined' || !firebase.initializeApp){ _dbFailed = true; return null; }
    if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    _db = firebase.firestore();
    return _db;
  }catch(e){
    console.warn('[ranking] Firebase indisponível:', e);
    _dbFailed = true;
    return null;
  }
}

// ---------- Enviar minha pontuação para o ranking ----------
let _syncTimer = null;
function syncScoreToCloud(){
  try{
    const db = getDb();
    if (!db) return;
    const id = ensurePlayerId();
    clearTimeout(_syncTimer);
    _syncTimer = setTimeout(()=>{
      try{
        const avatarEmoji = (AVATARS.find(a=>a.id===STATE.avatar)||{}).emoji || '🦸';
        const data = {
          name: String(STATE.playerName || 'Explorador(a)').slice(0, 30),
          avatar: String(avatarEmoji),
          color: String(STATE.avatarColor || '#FF6B6B'),
          xp: Math.max(0, Math.min(200000, Math.round(STATE.xp || 0))),
          stars: Math.max(0, Math.round(totalStarsEarned())),
          updatedAt: (firebase.firestore && firebase.firestore.FieldValue)
            ? firebase.firestore.FieldValue.serverTimestamp() : Date.now(),
        };
        // Sobrenome e turma são opcionais (jogadores antigos podem não ter preenchido
        // ainda) -- só inclui a chave no documento quando há valor, pra não mandar um
        // null que as regras do Firestore possam rejeitar.
        if (STATE.lastName) data.lastName = String(STATE.lastName).slice(0, 30);
        if (STATE.turma === 'A' || STATE.turma === 'B') data.turma = STATE.turma;
        db.collection('scores').doc(id).set(data, { merge: true })
          .catch(e=> console.warn('[ranking] falha ao enviar pontuação:', e));
      }catch(e){ console.warn('[ranking] erro ao montar dados de sincronização:', e); }
    }, 350);
  }catch(e){ console.warn('[ranking] syncScoreToCloud falhou:', e); }
}

// ---------- Buscar o ranking (tempo real, com fallback de leitura única) ----------
function loadRanking(onData, onError){
  let unsub = () => {};
  try{
    const db = getDb();
    if (!db){ onError && onError(new Error('Firebase indisponível')); return unsub; }
    const q = db.collection('scores').orderBy('xp', 'desc').limit(50);
    try{
      const stop = q.onSnapshot(
        snap => {
          const rows = [];
          snap.forEach(doc => rows.push(Object.assign({ id: doc.id }, doc.data())));
          onData(rows);
        },
        err => {
          console.warn('[ranking] onSnapshot falhou, tentando leitura única:', err);
          q.get().then(snap=>{
            const rows = [];
            snap.forEach(doc => rows.push(Object.assign({ id: doc.id }, doc.data())));
            onData(rows);
          }).catch(e2 => onError && onError(e2));
        }
      );
      unsub = stop;
    }catch(e){
      // navegador/SDK sem suporte a onSnapshot: faz leitura única
      q.get().then(snap=>{
        const rows = [];
        snap.forEach(doc => rows.push(Object.assign({ id: doc.id }, doc.data())));
        onData(rows);
      }).catch(e2 => onError && onError(e2));
    }
  }catch(e){
    onError && onError(e);
  }
  return unsub;
}

if (typeof module !== 'undefined') {
  module.exports = { FIREBASE_CONFIG, getDb, syncScoreToCloud, loadRanking };
}

</script>
<script>
/* App / UI - Simulado Gamificado 3º Trimestre - 4º Ano
   Telas: onboarding -> mapa -> ilha -> intro da fase -> quiz -> resultado */

const root = document.getElementById('app');
const toastEl = document.getElementById('toast');
let NAV = { screen:'boot' };
let QUIZ = null; // {subject, phase, index, answers:[], correctCount, selected:[]}
let _rankingUnsub = null;

function el(html){ const t=document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// rich(): usado SÓ para conteúdo autoral nosso (prompt/opções/explicação das questões),
// nunca para texto digitado pelo usuário. Permite marcadores HTML de apresentação como
// <span class="frac">...</span> (fração empilhada) sem escapar a tag. Não há risco de XSS
// aqui porque esse texto vem exclusivamente de questions.js, nunca de input do jogador.
function rich(s){ return String(s); }
function findSubject(id){ return SUBJECTS.find(s=>s.id===id); }
function findPhase(subject, id){ return subject.phases.find(p=>p.id===id); }

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> toastEl.classList.remove('show'), 2200);
}

// ---------------------------- BOOT ----------------------------
function boot(){
  registerPlayToday();
  ensurePlayerId();
  if (!STATE.playerName) { goTo('onboarding'); }
  else { goTo('map'); syncScoreToCloud(); }
}

function goTo(screen, params){
  if (NAV.screen === 'ranking' && screen !== 'ranking' && _rankingUnsub){ _rankingUnsub(); _rankingUnsub = null; }
  NAV = Object.assign({ screen }, params||{});
  render();
  window.scrollTo(0,0);
}

function render(){
  root.classList.add('fade');
  requestAnimationFrame(()=> root.classList.remove('fade'));
  if (NAV.screen === 'onboarding') return renderOnboarding();
  if (NAV.screen === 'map') return renderMap();
  if (NAV.screen === 'island') return renderIsland();
  if (NAV.screen === 'phaseIntro') return renderPhaseIntro();
  if (NAV.screen === 'quiz') return renderQuiz();
  if (NAV.screen === 'result') return renderResult();
  if (NAV.screen === 'ranking') return renderRanking();
}

// ---------------------------- ONBOARDING ----------------------------
let pendingAvatar = STATE.avatar || 'hero';
let pendingColor = STATE.avatarColor || AVATAR_COLORS[0];
let pendingTurma = (STATE.turma === 'A' || STATE.turma === 'B') ? STATE.turma : null;

function renderOnboarding(){
  root.innerHTML = '';
  const avatarsHtml = AVATARS.map(a => `
    <button class="avatar-pick ${a.id===pendingAvatar?'selected':''}" data-avatar="${a.id}" aria-label="Avatar ${a.id}">
      <span class="avatar-emoji">${a.emoji}</span>
    </button>`).join('');
  const colorsHtml = AVATAR_COLORS.map(c => `
    <button class="color-pick ${c===pendingColor?'selected':''}" data-color="${c}" style="background:${c}" aria-label="Cor ${c}"></button>`).join('');

  const card = el(`
    <div class="screen onboarding-screen">
      <div class="onboarding-card">
        <div class="mascot-big">${MASCOT}</div>
        <h1 class="title-xl">Bem-vindo(a) à<br/><span class="accent">Ilha do Conhecimento</span>!</h1>
        <p class="subtitle">Crie seu explorador para começar a aventura do 3º trimestre!</p>

        <div class="avatar-preview" id="avatarPreview" style="background:${pendingColor}">
          <span>${AVATARS.find(a=>a.id===pendingAvatar).emoji}</span>
        </div>

        <div class="section-label">Escolha seu avatar</div>
        <div class="avatar-grid">${avatarsHtml}</div>

        <div class="section-label">Escolha sua cor</div>
        <div class="color-grid">${colorsHtml}</div>

        <div class="section-label">Como podemos te chamar?</div>
        <input id="nameInput" class="name-input" maxlength="18" placeholder="Digite seu nome..." value="${esc(STATE.playerName||'')}" />

        <div class="section-label">Sobrenome <span class="label-optional">(opcional, ajuda a diferenciar colegas com o mesmo nome)</span></div>
        <input id="lastNameInput" class="name-input" maxlength="24" placeholder="ex: Silva" value="${esc(STATE.lastName||'')}" />

        <div class="section-label">Qual é a sua turma?</div>
        <div class="turma-grid">
          <button class="turma-pick ${pendingTurma==='A'?'selected':''}" data-turma="A">Turma A</button>
          <button class="turma-pick ${pendingTurma==='B'?'selected':''}" data-turma="B">Turma B</button>
        </div>

        <button id="startBtn" class="btn-primary btn-big" ${pendingTurma?'':'disabled'}>Começar aventura 🚀</button>
      </div>
    </div>`);
  root.appendChild(card);

  card.querySelectorAll('.avatar-pick').forEach(b => b.addEventListener('click', ()=>{
    SFX.unlock(); SFX.click();
    pendingAvatar = b.dataset.avatar;
    card.querySelectorAll('.avatar-pick').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    document.getElementById('avatarPreview').querySelector('span').textContent = AVATARS.find(a=>a.id===pendingAvatar).emoji;
  }));
  card.querySelectorAll('.color-pick').forEach(b => b.addEventListener('click', ()=>{
    SFX.unlock(); SFX.click();
    pendingColor = b.dataset.color;
    card.querySelectorAll('.color-pick').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    document.getElementById('avatarPreview').style.background = pendingColor;
  }));
  card.querySelectorAll('.turma-pick').forEach(b => b.addEventListener('click', ()=>{
    SFX.unlock(); SFX.click();
    pendingTurma = b.dataset.turma;
    card.querySelectorAll('.turma-pick').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    card.querySelector('#startBtn').disabled = false;
  }));
  card.querySelector('#startBtn').addEventListener('click', ()=>{
    if (card.querySelector('#startBtn').disabled) return;
    SFX.unlock();
    const name = card.querySelector('#nameInput').value.trim() || 'Explorador(a)';
    const lastName = card.querySelector('#lastNameInput').value.trim();
    STATE.playerName = name; STATE.lastName = lastName; STATE.avatar = pendingAvatar; STATE.avatarColor = pendingColor;
    STATE.turma = pendingTurma;
    if(!STATE.createdAt) STATE.createdAt = Date.now();
    saveGame();
    syncScoreToCloud();
    SFX.whoosh();
    showToast(pick(MASCOT_LINES.welcome));
    goTo('map');
  });
}

// ---------------------------- TOP BAR ----------------------------
function topBarHtml(){
  const lvl = levelForXp(STATE.xp);
  const into = xpIntoLevel(STATE.xp);
  const avatarEmoji = AVATARS.find(a=>a.id===STATE.avatar)?.emoji || '🦸';
  return `
  <div class="topbar">
    <div class="tb-avatar" style="background:${STATE.avatarColor}">${avatarEmoji}</div>
    <div class="tb-info">
      <div class="tb-name">${esc(STATE.playerName)} <span class="tb-level">Nv. ${lvl}</span></div>
      <div class="xp-bar"><div class="xp-fill" style="width:${into}%"></div></div>
    </div>
    <div class="tb-stat" title="Moedas">🪙 <b>${STATE.coins}</b></div>
    <div class="tb-stat" title="Sequência de dias">🔥 <b>${STATE.streak}</b></div>
    <button class="tb-settings" id="settingsBtn" aria-label="Configurações">⚙️</button>
  </div>`;
}

function wireTopBar(container){
  container.querySelector('#settingsBtn')?.addEventListener('click', openSettings);
}

function openSettings(){
  SFX.click();
  const modal = el(`
    <div class="modal-backdrop">
      <div class="modal">
        <h2>Configurações</h2>
        <label class="settings-row"><span>Som 🔊</span>
          <input type="checkbox" id="soundToggle" ${STATE.soundOn?'checked':''}/>
        </label>
        <button class="btn-secondary" id="editAvatarBtn">Editar avatar/nome</button>
        <button class="btn-danger" id="resetBtn">Reiniciar progresso</button>
        <button class="btn-primary" id="closeModal">Fechar</button>
      </div>
    </div>`);
  document.body.appendChild(modal);
  modal.querySelector('#soundToggle').addEventListener('change', (e)=>{
    STATE.soundOn = e.target.checked; SFX.enabled = STATE.soundOn; saveGame();
  });
  modal.querySelector('#editAvatarBtn').addEventListener('click', ()=>{ modal.remove(); goTo('onboarding'); });
  modal.querySelector('#resetBtn').addEventListener('click', ()=>{
    if(confirm('Tem certeza? Isso vai apagar todo o progresso do jogo.')){
      resetGame(); modal.remove(); goTo('onboarding');
    }
  });
  modal.querySelector('#closeModal').addEventListener('click', ()=> modal.remove());
  modal.addEventListener('click', (e)=>{ if(e.target===modal) modal.remove(); });
}

// ---------------------------- MAPA (ILHAS) ----------------------------
function renderMap(){
  root.innerHTML = '';
  const wrap = el(`<div class="screen map-screen"></div>`);
  wrap.insertAdjacentHTML('beforeend', topBarHtml());

  const mascotMsg = el(`<div class="mascot-banner"><span class="mascot-emoji">${MASCOT}</span><span class="speech">${esc(pick(MASCOT_LINES.welcome))}</span></div>`);
  wrap.appendChild(mascotMsg);

  const rankingCta = el(`<button class="ranking-cta" id="rankingCta">🏆 Ver Ranking da Turma</button>`);
  wrap.appendChild(rankingCta);

  const grid = el(`<div class="island-grid"></div>`);
  SUBJECTS.forEach(subject => {
    const totalStars = subject.phases.length * 3;
    const earned = subjectStars(subject);
    const complete = isSubjectComplete(subject);
    const card = el(`
      <button class="island-card" data-subject="${subject.id}" style="--c:${subject.color}; --cd:${subject.colorDark}">
        ${complete ? '<div class="island-badge">🏆</div>' : ''}
        <div class="island-icon">${subject.icon}</div>
        <div class="island-name">${esc(subject.name)}</div>
        <div class="island-subtitle">${esc(subject.subtitle)}</div>
        <div class="island-stars">⭐ ${earned}/${totalStars}</div>
        <div class="island-progress-bar"><div class="island-progress-fill" style="width:${Math.round(earned/totalStars*100)}%"></div></div>
      </button>`);
    grid.appendChild(card);
  });
  wrap.appendChild(grid);

  if (allSubjectsComplete()){
    wrap.appendChild(el(`<div class="trophy-banner">🏆 Você é o <b>Mestre do 3º Trimestre</b>! Todas as ilhas concluídas! 🏆</div>`));
  }

  const badgesSection = renderBadgesSection();
  wrap.appendChild(badgesSection);

  root.appendChild(wrap);
  wireTopBar(wrap);
  wrap.querySelectorAll('.island-card').forEach(c => c.addEventListener('click', ()=>{
    SFX.click();
    goTo('island', { subjectId: c.dataset.subject });
  }));
  wrap.querySelector('#rankingCta').addEventListener('click', ()=>{
    SFX.click();
    goTo('ranking');
  });
}

// ---------------------------- RANKING (compartilhado via Firebase) ----------------------------
function renderRanking(){
  root.innerHTML = '';
  const wrap = el(`<div class="screen ranking-screen"></div>`);
  wrap.insertAdjacentHTML('beforeend', topBarHtml());

  wrap.appendChild(el(`
    <div class="island-header">
      <button class="back-btn" id="backToMap">⬅ Mapa</button>
      <div class="island-header-title">🏆 Ranking da Turma</div>
    </div>`));

  wrap.appendChild(el(`<div class="mascot-banner"><span class="mascot-emoji">${MASCOT}</span><span class="speech">Veja como você está em relação aos seus colegas! O ranking é o mesmo pra todo mundo, em qualquer celular.</span></div>`));

  const tabsWrap = el(`
    <div class="ranking-tabs" id="rankingTabs">
      <button class="ranking-tab selected" data-filter="all">Geral</button>
      <button class="ranking-tab" data-filter="A">Turma A</button>
      <button class="ranking-tab" data-filter="B">Turma B</button>
    </div>`);
  wrap.appendChild(tabsWrap);

  const listWrap = el(`<div class="ranking-list" id="rankingList"><div class="ranking-loading">⏳ Carregando ranking...</div></div>`);
  wrap.appendChild(listWrap);

  root.appendChild(wrap);
  wireTopBar(wrap);
  wrap.querySelector('#backToMap').addEventListener('click', ()=>{
    SFX.click();
    if (_rankingUnsub){ _rankingUnsub(); _rankingUnsub = null; }
    goTo('map');
  });

  let allRows = [];
  let currentFilter = 'all';

  function paintRanking(){
    const list = document.getElementById('rankingList');
    if (!list) return; // tela já trocou
    let rows = allRows;
    if (currentFilter === 'A') rows = allRows.filter(r => r.turma === 'A');
    else if (currentFilter === 'B') rows = allRows.filter(r => r.turma === 'B');
    if (!rows.length){
      list.innerHTML = currentFilter === 'all'
        ? `<div class="ranking-empty">🌱 Ainda não há ninguém no ranking. Jogue uma fase para ser o primeiro a aparecer aqui!</div>`
        : `<div class="ranking-empty">🌱 Ainda não há ninguém da Turma ${currentFilter} no ranking.</div>`;
      return;
    }
    list.innerHTML = rows.map((r, i)=>{
      const mine = r.id === STATE.playerId;
      const pos = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'º';
      const first = r.name || 'Explorador(a)';
      const fullName = esc(r.lastName ? (first + ' ' + r.lastName) : first);
      const turmaBadge = (r.turma === 'A' || r.turma === 'B')
        ? `<span class="turma-badge">Turma ${r.turma}</span>`
        : (currentFilter === 'all' ? `<span class="turma-badge turma-unknown">turma não informada</span>` : '');
      return `<div class="ranking-row ${mine?'mine':''}">
        <div class="rank-pos">${pos}</div>
        <div class="rank-avatar" style="background:${esc(r.color||'#FF6B6B')}">${esc(r.avatar||'🦸')}</div>
        <div class="rank-info">
          <div class="rank-name">${fullName}${mine?' <span class="you-tag">você</span>':''}</div>
          <div class="rank-meta">
            <span class="rank-stats">⭐ ${r.stars||0} estrelas · ✨ ${r.xp||0} XP</span>
            ${turmaBadge}
          </div>
        </div>
      </div>`;
    }).join('');
  }

  tabsWrap.querySelectorAll('.ranking-tab').forEach(btn => btn.addEventListener('click', ()=>{
    SFX.click();
    currentFilter = btn.dataset.filter;
    tabsWrap.querySelectorAll('.ranking-tab').forEach(x=>x.classList.remove('selected'));
    btn.classList.add('selected');
    paintRanking();
  }));

  ensurePlayerId();
  if (_rankingUnsub){ _rankingUnsub(); _rankingUnsub = null; }
  _rankingUnsub = loadRanking((rows)=>{
    allRows = rows || [];
    paintRanking();
  }, (err)=>{
    const list = document.getElementById('rankingList');
    if (!list) return;
    list.innerHTML = `<div class="ranking-empty">😕 Não foi possível carregar o ranking agora.<br/>Verifique sua internet e tente novamente mais tarde.</div>`;
  });
}

function renderBadgesSection(){
  const defs = Object.assign({}, BADGE_DEFS);
  SUBJECTS.forEach(s => { defs[subjectBadgeId(s.id)] = { icon:s.icon, name:'Ilha completa: '+s.subtitle, desc:'Completou todas as fases de '+s.subtitle }; });
  const items = Object.keys(defs).map(id => {
    const owned = STATE.badges.includes(id) || (id.startsWith('island_') && isSubjectComplete(findSubject(id.replace('island_',''))));
    const d = defs[id];
    return `<div class="badge-chip ${owned?'owned':'locked'}" title="${esc(d.desc)}">
      <span class="badge-icon">${owned?d.icon:'🔒'}</span><span class="badge-name">${esc(d.name)}</span></div>`;
  }).join('');
  return el(`<div class="badges-section"><div class="section-label">Suas conquistas</div><div class="badge-row">${items}</div></div>`);
}

// ---------------------------- ILHA (TRILHA DE FASES) ----------------------------
function renderIsland(){
  const subject = findSubject(NAV.subjectId);
  root.innerHTML = '';
  const wrap = el(`<div class="screen island-screen" style="--c:${subject.color}; --cd:${subject.colorDark}"></div>`);
  wrap.insertAdjacentHTML('beforeend', topBarHtml());

  wrap.appendChild(el(`
    <div class="island-header">
      <button class="back-btn" id="backToMap">⬅ Mapa</button>
      <div class="island-header-title">${subject.icon} ${esc(subject.name)}</div>
    </div>`));

  wrap.appendChild(el(`<div class="mascot-banner"><span class="mascot-emoji">${MASCOT}</span><span class="speech">${esc(pick(MASCOT_LINES.islandIntro))}</span></div>`));

  const trail = el(`<div class="trail"></div>`);
  subject.phases.forEach((phase, idx) => {
    const unlocked = isPhaseUnlocked(subject, idx);
    const result = STATE.phaseResults[phase.id];
    const stars = result ? result.stars : 0;
    const node = el(`
      <div class="trail-node-wrap ${idx%2===0?'left':'right'}">
        <button class="trail-node ${unlocked?'unlocked':'locked'} ${stars===3?'maxed':''}" data-phase="${phase.id}" ${unlocked?'':'disabled'}>
          <span class="trail-node-num">${unlocked ? (idx+1) : '🔒'}</span>
        </button>
        <div class="trail-node-label">${esc(phase.name)}</div>
        <div class="trail-node-stars">${renderStarsInline(stars)}</div>
      </div>`);
    trail.appendChild(node);
  });
  wrap.appendChild(trail);

  root.appendChild(wrap);
  wireTopBar(wrap);
  wrap.querySelector('#backToMap').addEventListener('click', ()=>{ SFX.click(); goTo('map'); });
  wrap.querySelectorAll('.trail-node.unlocked').forEach(b => b.addEventListener('click', ()=>{
    SFX.click();
    goTo('phaseIntro', { subjectId: subject.id, phaseId: b.dataset.phase });
  }));
}

function renderStarsInline(stars){
  let s = '';
  for(let i=0;i<3;i++) s += `<span class="star ${i<stars?'filled':''}">★</span>`;
  return s;
}

// ---------------------------- INTRO DA FASE ----------------------------
function renderPhaseIntro(){
  const subject = findSubject(NAV.subjectId);
  const phase = findPhase(subject, NAV.phaseId);
  const result = STATE.phaseResults[phase.id];
  root.innerHTML = '';
  const wrap = el(`
    <div class="screen phase-intro-screen" style="--c:${subject.color}; --cd:${subject.colorDark}">
      <div class="phase-intro-card">
        <div class="phase-intro-icon">${subject.icon}</div>
        <div class="phase-intro-cap">${esc(phase.cap)}</div>
        <h2 class="phase-intro-title">${esc(phase.name)}</h2>
        <div class="phase-intro-stars">${renderStarsInline(result?result.stars:0)}</div>
        <div class="mascot-banner small"><span class="mascot-emoji">${MASCOT}</span><span class="speech">${esc(pick(MASCOT_LINES.phaseIntro))}</span></div>
        <p class="phase-intro-sub">${phase.questions.length} perguntas • responda com calma!</p>
        <button class="btn-primary btn-big" id="playBtn">${result?'Jogar de novo':'Jogar'} ▶️</button>
        <button class="back-btn" id="backToIsland">⬅ Voltar para a ilha</button>
      </div>
    </div>`);
  root.appendChild(wrap);
  wrap.querySelector('#backToIsland').addEventListener('click', ()=>{ SFX.click(); goTo('island', { subjectId: subject.id }); });
  wrap.querySelector('#playBtn').addEventListener('click', ()=>{
    SFX.whoosh();
    const scorable = phase.questions.filter(q => q.type !== 'reflection').length;
    QUIZ = { subject, phase, index:0, correctCount:0, total: phase.questions.length, scorable, selected:null };
    goTo('quiz', { subjectId: subject.id, phaseId: phase.id });
  });
}

// ---------------------------- QUIZ ----------------------------
function renderQuiz(){
  const { subject, phase } = QUIZ;
  const q = phase.questions[QUIZ.index];
  root.innerHTML = '';
  const progressPct = Math.round((QUIZ.index)/QUIZ.total*100);
  const wrap = el(`
    <div class="screen quiz-screen" style="--c:${subject.color}; --cd:${subject.colorDark}">
      <div class="quiz-top">
        <button class="back-btn" id="quitQuiz">✕</button>
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${progressPct}%"></div></div>
        <div class="quiz-counter">${QUIZ.index+1}/${QUIZ.total}</div>
      </div>
      <div class="quiz-card-area" id="quizCardArea"></div>
    </div>`);
  root.appendChild(wrap);
  wrap.querySelector('#quitQuiz').addEventListener('click', ()=>{
    if(confirm('Sair do quiz? Seu progresso nessa fase será perdido.')){ goTo('phaseIntro', { subjectId: subject.id, phaseId: phase.id }); }
  });

  const area = wrap.querySelector('#quizCardArea');
  area.appendChild(renderQuestionCard(q));
}

function renderQuestionCard(q){
  if (q.type === 'choice') return renderChoiceCard(q);
  if (q.type === 'items') return renderItemsCard(q);
  if (q.type === 'reflection') return renderReflectionCard(q);
}

function renderChoiceCard(q){
  const card = el(`
    <div class="q-card">
      <div class="q-part">${esc(q.part)}</div>
      <div class="q-prompt">${rich(q.prompt)}</div>
      ${q.multi ? '<div class="q-multi-badge">🔢 ESCOLHA VÁRIAS</div>' : ''}
      <div class="q-options" id="qOptions"></div>
      <button class="btn-primary btn-big q-submit" id="qSubmit" disabled>Confirmar</button>
    </div>`);
  const optsWrap = card.querySelector('#qOptions');
  const minNeeded = q.multi ? 2 : 1;
  let selected = new Set();
  q.options.forEach((opt, i) => {
    const b = el(`<button class="option-btn" data-i="${i}">${rich(opt)}</button>`);
    b.addEventListener('click', ()=>{
      if (card.classList.contains('answered')) return;
      SFX.click();
      if (q.multi){
        if (selected.has(i)){ selected.delete(i); b.classList.remove('selected'); }
        else { selected.add(i); b.classList.add('selected'); }
      } else {
        optsWrap.querySelectorAll('.option-btn').forEach(x=>x.classList.remove('selected'));
        selected = new Set([i]);
        b.classList.add('selected');
      }
      card.querySelector('#qSubmit').disabled = selected.size<minNeeded;
    });
    optsWrap.appendChild(b);
  });
  card.querySelector('#qSubmit').addEventListener('click', ()=>{
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    const correctSet = new Set(q.correct);
    const isCorrect = selected.size===correctSet.size && [...selected].every(i=>correctSet.has(i));
    optsWrap.querySelectorAll('.option-btn').forEach((b,i)=>{
      if (correctSet.has(i)) b.classList.add('correct');
      else if (selected.has(i)) b.classList.add('incorrect');
    });
    finishAnswer(isCorrect, card, false, q);
  });
  return card;
}

function renderItemsCard(q){
  const card = el(`
    <div class="q-card">
      <div class="q-part">${esc(q.part)}</div>
      <div class="q-prompt">${rich(q.prompt)}</div>
      <div class="q-items" id="qItems"></div>
      <button class="btn-primary btn-big q-submit" id="qSubmit" disabled>Confirmar</button>
    </div>`);
  const itemsWrap = card.querySelector('#qItems');
  const answers = new Array(q.items.length).fill(null);
  q.items.forEach((item, idx) => {
    const row = el(`
      <div class="q-item-row">
        <div class="q-item-label">${rich(item.label)}</div>
        <div class="q-item-opts">
          ${item.options.map((o,oi)=>`<button class="mini-opt" data-item="${idx}" data-opt="${oi}">${rich(o)}</button>`).join('')}
        </div>
      </div>`);
    itemsWrap.appendChild(row);
  });
  itemsWrap.querySelectorAll('.mini-opt').forEach(b => b.addEventListener('click', ()=>{
    if (card.classList.contains('answered')) return;
    SFX.click();
    const itemIdx = +b.dataset.item;
    answers[itemIdx] = +b.dataset.opt;
    itemsWrap.querySelectorAll(`.mini-opt[data-item="${itemIdx}"]`).forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected');
    card.querySelector('#qSubmit').disabled = answers.some(a=>a===null);
  }));
  card.querySelector('#qSubmit').addEventListener('click', ()=>{
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    let allCorrect = true;
    q.items.forEach((item, idx) => {
      const correct = item.correct === answers[idx];
      if (!correct) allCorrect = false;
      itemsWrap.querySelectorAll(`.mini-opt[data-item="${idx}"]`).forEach((b)=>{
        const oi = +b.dataset.opt;
        if (oi === item.correct) b.classList.add('correct');
        else if (oi === answers[idx]) b.classList.add('incorrect');
      });
    });
    finishAnswer(allCorrect, card, false, q);
  });
  return card;
}

function renderReflectionCard(q){
  const card = el(`
    <div class="q-card">
      <div class="q-part">${esc(q.part)}</div>
      <div class="q-prompt">${rich(q.prompt)}</div>
      <div class="q-hint">Pergunta aberta — não vale ponto, é só para você refletir!</div>
      <textarea id="qText" class="q-textarea" rows="4" placeholder="Escreva aqui o que você pensa..."></textarea>
      <button class="btn-primary btn-big q-submit" id="qSubmit">Enviar</button>
    </div>`);
  card.querySelector('#qSubmit').addEventListener('click', ()=>{
    if (card.classList.contains('answered')) return;
    card.classList.add('answered');
    finishAnswer(true, card, true);
  });
  return card;
}

function finishAnswer(isCorrect, card, isReflection, q){
  if (!isReflection){
    if (isCorrect){ SFX.correct(); QUIZ.correctCount++; }
    else { SFX.wrong(); }
    card.classList.add(isCorrect ? 'flash-correct' : 'flash-incorrect');
    const banner = el(`<div class="feedback-banner ${isCorrect?'good':'bad'}">${isCorrect ? '✅ '+esc(pick(MASCOT_LINES.correct)) : '❌ '+esc(pick(MASCOT_LINES.wrong))}</div>`);
    card.appendChild(banner);
    if (q && q.explain){
      const explainBox = el(`<div class="explain-box"><div class="explain-icon">💡</div><div class="explain-text"><b>Por quê?</b>${rich(q.explain)}</div></div>`);
      card.appendChild(explainBox);
    }
  } else {
    const banner = el(`<div class="feedback-banner good">💬 Obrigado por compartilhar!</div>`);
    card.appendChild(banner);
  }
  const nextBtn = el(`<button class="btn-primary btn-big next-btn">${QUIZ.index+1 < QUIZ.total ? 'Próxima' : 'Ver resultado'} ➡</button>`);
  card.appendChild(nextBtn);
  card.querySelector('.q-submit')?.remove();
  nextBtn.addEventListener('click', ()=>{
    SFX.click();
    QUIZ.index++;
    if (QUIZ.index >= QUIZ.total){ finishQuiz(); }
    else { render(); }
  });
  nextBtn.scrollIntoView({behavior:'smooth', block:'end'});
}

function finishQuiz(){
  const { subject, phase, correctCount, total, scorable } = QUIZ;
  const stars = starsFor(correctCount, scorable || total);
  const prev = STATE.phaseResults[phase.id];
  const prevStars = prev ? prev.stars : 0;
  const isFirstTime = !prev;
  const improved = stars > prevStars;

  const xpGained = correctCount*10 + (stars===3?20:stars===2?10:0);
  const coinsGained = correctCount*5;
  STATE.xp += xpGained;
  STATE.coins += coinsGained;
  STATE.phaseResults[phase.id] = {
    stars: Math.max(stars, prevStars),
    bestCorrect: Math.max(correctCount, prev?prev.bestCorrect:0),
    total, attempts: (prev?prev.attempts:0)+1,
  };
  if (isFirstTime) awardBadge('firstPhase');
  if (stars===3) awardBadge('allStars');

  let subjectJustCompleted = false, gameJustCompleted = false;
  if (isSubjectComplete(subject)) {
    subjectJustCompleted = awardBadge(subjectBadgeId(subject.id));
  }
  if (allSubjectsComplete()) {
    gameJustCompleted = awardBadge('gameComplete');
  }
  saveGame();
  syncScoreToCloud();

  QUIZ.resultData = { stars, prevStars, correctCount, total, xpGained, coinsGained, subjectJustCompleted, gameJustCompleted, improved };
  goTo('result', { subjectId: subject.id, phaseId: phase.id });
}

// ---------------------------- RESULTADO ----------------------------
function renderResult(){
  const { subject, phase, resultData } = QUIZ;
  const { stars, correctCount, total, xpGained, coinsGained, subjectJustCompleted, gameJustCompleted } = resultData;
  root.innerHTML = '';
  const wrap = el(`
    <div class="screen result-screen" style="--c:${subject.color}; --cd:${subject.colorDark}">
      <div class="result-card">
        <div class="result-stars" id="resultStars">
          <span class="big-star s1">★</span><span class="big-star s2">★</span><span class="big-star s3">★</span>
        </div>
        <h2 class="result-title">${esc(phase.name)}</h2>
        <div class="result-score">${correctCount}/${total} corretas</div>
        <div class="mascot-banner"><span class="mascot-emoji">${MASCOT}</span><span class="speech">${esc(mascotResultLine(stars))}</span></div>
        <div class="result-rewards">
          <div class="reward-chip">✨ +${xpGained} XP</div>
          <div class="reward-chip">🪙 +${coinsGained} moedas</div>
        </div>
        <button class="btn-primary btn-big" id="continueBtn">Continuar ➡</button>
        <button class="btn-secondary btn-map" id="mapBtn">🗺️ Voltar ao mapa</button>
        <button class="btn-secondary" id="retryBtn">Jogar de novo 🔁</button>
      </div>
      <canvas id="confettiCanvas"></canvas>
    </div>`);
  root.appendChild(wrap);

  // Anima as estrelas em sequência
  const starEls = wrap.querySelectorAll('.big-star');
  starEls.forEach((s,i)=>{ s.classList.remove('filled'); });
  setTimeout(()=>{
    for(let i=0;i<stars;i++){
      setTimeout(()=>{ starEls[i].classList.add('filled','pop'); SFX.star(); }, i*350);
    }
    if (stars>0) setTimeout(()=> SFX.coin(), stars*350+150);
  }, 300);

  if (stars >= 2) burstConfetti(wrap.querySelector('#confettiCanvas'));
  if (stars === 3) SFX.victory();

  wrap.querySelector('#continueBtn').addEventListener('click', ()=>{
    SFX.click();
    if (gameJustCompleted){ showToast(pick(MASCOT_LINES.gameComplete)); }
    else if (subjectJustCompleted){ showToast(pick(MASCOT_LINES.islandComplete)); }
    goTo('island', { subjectId: subject.id });
  });
  wrap.querySelector('#retryBtn').addEventListener('click', ()=>{
    SFX.click();
    goTo('phaseIntro', { subjectId: subject.id, phaseId: phase.id });
  });
  wrap.querySelector('#mapBtn').addEventListener('click', ()=>{
    SFX.click();
    if (gameJustCompleted){ showToast(pick(MASCOT_LINES.gameComplete)); }
    else if (subjectJustCompleted){ showToast(pick(MASCOT_LINES.islandComplete)); }
    goTo('map');
  });
}

function mascotResultLine(stars){
  if (stars===3) return pick(MASCOT_LINES.threeStars);
  if (stars===2) return pick(MASCOT_LINES.twoStars);
  if (stars===1) return pick(MASCOT_LINES.oneStar);
  return pick(MASCOT_LINES.zeroStars);
}

// ---------------------------- CONFETE (canvas) ----------------------------
function burstConfetti(canvas){
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize();
  const colors = ['#FF6B6B','#4ECDC4','#FFD93D','#6BCB77','#A78BFA','#FF8FAB','#5AC8FA'];
  const particles = [];
  const count = Math.min(140, Math.floor(window.innerWidth/4));
  for(let i=0;i<count;i++){
    particles.push({
      x: Math.random()*canvas.width, y: -20 - Math.random()*canvas.height*0.5,
      vx: (Math.random()-0.5)*3, vy: 2+Math.random()*4,
      size: 4+Math.random()*6, color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360, vr: (Math.random()-0.5)*10,
      shape: Math.random()<0.5?'rect':'circle',
    });
  }
  let frame = 0;
  const maxFrames = 220;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      if (p.shape==='rect') ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      else { ctx.beginPath(); ctx.arc(0,0,p.size/2,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    });
    if (frame < maxFrames) requestAnimationFrame(tick);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  tick();
}

// ---------------------------- INIT ----------------------------
window.addEventListener('DOMContentLoaded', ()=>{
  SFX.enabled = STATE.soundOn !== false;
  boot();
});
window.addEventListener('resize', ()=>{
  const c = document.getElementById('confettiCanvas');
  if (c){ c.width = window.innerWidth; c.height = window.innerHeight; }
});

</script>
